<style>
:root {
  --paper: #EFF2F6;
  --stagebg: #F8FAFC;
  --ink: #17202B;
  --muted: #5A6678;
  --line: #C9D2DE;
  --accent: #2F5FA8;
  --accent-soft: #DCE6F5;
  --amber: #9A6B0F;
  --amber-soft: #F3E8CE;
  --bad: #B3372E;
  --bad-soft: #F6E2E0;
  --good: #2E7D4F;
  --good-soft: #DFEEE5;
  --inset: #E7EBF1;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --disp: "Piazzolla", Georgia, serif;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--stagebg);
  color: var(--ink);
  font-family: "Golos Text", "Segoe UI", Arial, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#root { position: fixed; inset: 0; }

/* ---------- рамка приложения ---------- */
.progress {
  position: fixed; top: 0; left: 0; height: 4px;
  background: var(--accent); z-index: 40;
  transition: width .35s ease;
}
.viewport {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.stage {
  width: 1280px; height: 720px;
  position: relative;
  overflow: hidden;
  flex: none;
}
.footer {
  position: fixed; left: 16px; bottom: 12px;
  font-family: var(--mono); font-size: .72rem; color: var(--muted);
  z-index: 40; opacity: .75; pointer-events: none;
}

/* ---------- фон сцены ---------- */
.bgfx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

/* ---------- заголовок слайда ---------- */
.shead {
  position: absolute; top: 30px; left: 70px; right: 70px;
  display: flex; align-items: baseline; gap: .9rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: .7rem;
}
.shead .snum { font-family: var(--mono); font-size: 1.1rem; color: var(--accent); }
.shead .stitle { font-family: var(--disp); font-size: 2.8rem; font-weight: 650; line-height: 1.05; }
.shead .sen { margin-left: auto; font-family: var(--mono); font-size: .9rem; color: var(--muted); }

.scene { position: absolute; top: 122px; left: 70px; right: 70px; bottom: 80px; }

/* ---------- примитивы шагов ---------- */
.st { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
.st.on { opacity: 1; transform: none; }
.d1 { transition-delay: .12s; } .d2 { transition-delay: .24s; } .d3 { transition-delay: .36s; }
.d4 { transition-delay: .48s; } .d5 { transition-delay: .6s; }  .d6 { transition-delay: .72s; }

.band {
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: .7rem 1.1rem;
  font-size: 1.15rem;
  text-align: center;
}
.band.warn { background: var(--amber-soft); border-color: var(--amber); }
.hl { background: var(--accent-soft); border-radius: 4px; padding: .02em .08em; font-weight: 500; }
.band .hl { background: var(--stagebg); }
.chip {
  display: inline-block;
  border: 1px solid var(--line);
  background: var(--inset);
  border-radius: 999px;
  padding: .18rem .75rem;
  font-size: .85rem;
}
.mono { font-family: var(--mono); }
.mut { color: var(--muted); }
.card {
  background: var(--stagebg);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: .9rem 1rem;
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes popIn { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

/* ================= S0: титул ================= */
.t-wrap { position: absolute; inset: 0; }
.t-title { position: absolute; top: 76px; left: 0; right: 0; text-align: center; font-family: var(--disp); font-size: 5.4rem; font-weight: 650; line-height: 1.02; }
.t-panel {
  position: relative; width: 1080px; height: 360px;
  border-radius: 8px; overflow: hidden;
  border: 1px solid var(--line);
  background: var(--stagebg);
}
.t-schema {
  position: absolute; inset: 0 0 44px;
  display: flex; align-items: center; justify-content: center; gap: 1.6rem;
  padding: 1rem;
}
.t-core {
  border: 2.5px solid var(--accent); border-radius: 7px; background: var(--accent-soft);
  padding: 1.5rem 2.2rem; text-align: center; font-weight: 600; font-size: 1.7rem;
}
.t-core small { display: block; font-family: var(--mono); font-weight: 400; font-size: 1.1rem; color: var(--muted); margin-top: .35rem; }
.t-block { border: 1.5px dashed var(--amber); background: var(--amber-soft); border-radius: 6px; padding: .9rem 1.4rem; font-size: 1.35rem; color: var(--amber); }
.t-legend {
  position: absolute; left: 0; right: 0; bottom: 24px;
  display: flex; justify-content: center; gap: 2.4rem;
  font-size: 1.08rem; color: var(--muted);
}
.t-legend .li { display: flex; align-items: center; gap: .55rem; }
.t-legend .sw { width: 16px; height: 16px; border-radius: 4px; flex: none; }
.t-legend .sw.model { background: var(--accent-soft); border: 1.5px solid var(--accent); }
.t-legend .sw.codeh { background: var(--amber-soft); border: 1.5px dashed var(--amber); }
.t-gl { position: absolute; inset: 0; width: 100%; height: 100%; }
.t-ad {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem;
  color: #fff; text-shadow: 0 2px 14px rgba(30,10,80,.45);
  transition: opacity .8s ease;
}
.t-ad .big { font-size: 3.3rem; font-weight: 700; }
.t-ad .sub { font-size: 1.4rem; opacity: .92; }
.t-ad .ad-close {
  position: absolute; top: 12px; right: 12px;
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.65);
  background: rgba(20,10,40,.22);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; line-height: 1; color: rgba(255,255,255,.92);
  text-shadow: none; cursor: pointer;
}
.t-ad .ad-word {
  position: absolute; left: 18px; bottom: 14px;
  font-family: var(--mono); font-size: 1rem; letter-spacing: .2em; text-transform: uppercase;
  color: rgba(255,255,255,.88); text-shadow: none;
}
.t-panel.stripped .t-ad, .t-panel.stripped .t-gl { opacity: 0; pointer-events: none; }
.t-gl { transition: opacity 1.1s ease .15s; }
/* сценка: курсор закрывает баннер */
.t-panel.stripped .t-ad { transition: opacity .7s ease 1.5s; }
.t-panel.stripped .t-gl { transition: opacity 1s ease 1.65s; }
.t-panel.stripped .ad-close { animation: adPress .3s ease 1.2s; }
@keyframes adPress { 40% { transform: scale(.82); background: rgba(20,10,40,.5); } }
.t-panelwrap { position: absolute; top: 212px; left: 50%; transform: translateX(-50%); }
.t-cursor {
  position: absolute; left: calc(100% - 34px); top: 22px; width: 26px; height: 26px;
  z-index: 6; pointer-events: none; opacity: 0;
  transform-origin: 4px 2px;
  filter: drop-shadow(0 2px 5px rgba(23,32,43,.35));
  animation: curIn 1.15s cubic-bezier(.25,.6,.2,1) both, curClick .3s ease 1.15s forwards, curOut .5s ease 2.5s forwards;
}
@keyframes curIn { from { opacity: 1; transform: translate(340px, 340px); } to { opacity: 1; transform: translate(0, 0); } }
@keyframes curClick { 0%, 100% { transform: scale(1); } 45% { transform: scale(.8); } }
@keyframes curOut { from { opacity: 1; } to { opacity: 0; } }
.t-fallback { background: linear-gradient(120deg, #7b2ff7, #4062ff 55%, #b62fd4); }
.t-thesis { position: absolute; top: 606px; left: 0; right: 0; text-align: center; font-size: 1.45rem; color: var(--muted); }

/* ================= S1: модель ================= */
.m-def { font-size: 1.75rem; line-height: 1.4; max-width: 1120px; }
.m-stairs { display: flex; align-items: flex-end; gap: 1.4rem; height: 392px; }
.m-step { flex: 1; display: flex; flex-direction: column; }
.m-step .card { border-top: 3px solid var(--accent); height: 260px; box-sizing: border-box; display: flex; flex-direction: column; }
.m-fig { height: 96px; flex: none; width: 100%; display: flex; align-items: center; justify-content: center; margin: .2rem 0 .55rem; }
.m-step .lbl { font-family: var(--mono); font-size: .75rem; color: var(--accent); margin-bottom: .35rem; }
.m-step h4 { margin: 0 0 .4rem; font-size: 1.08rem; }
.m-step p { margin: 0; font-size: .88rem; color: var(--muted); line-height: 1.45; text-wrap: balance; }
.m-step p b { color: var(--ink); font-weight: 600; }
.m-s1 { padding-bottom: 0; }
.m-s2 { padding-bottom: 55px; }
.m-s3 { padding-bottom: 110px; }
.m-formula { font-family: var(--mono); font-size: 3rem; margin: 0; }
.m-chart { display: block; width: 100%; height: auto; max-height: 88px; }
.m-grid line { stroke: var(--line); stroke-width: 1; opacity: .5; }
.m-take { position: absolute; left: 70px; right: 70px; bottom: 20px; text-align: center; font-size: 1.2rem; }
.m-dot { fill: var(--muted); opacity: 0; }
.on .m-dot { animation: popIn .4s ease both; }
.m-curve { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-dasharray: 400; stroke-dashoffset: 400; }
.on .m-curve { transition: stroke-dashoffset 1.4s ease .5s; stroke-dashoffset: 0; }

  transition: opacity .5s ease, transform .5s ease, box-shadow .4s ease; }
.c7-item .n { font-family: var(--mono); font-size: .78rem; color: var(--amber); padding-top: .1rem; }
.c7-item b { display: block; font-size: .98rem; line-height: 1.2; }
.c7-item small { display: block; font-size: .78rem; color: var(--muted); line-height: 1.3; margin-top: .1rem; }
.c7-item.cur { box-shadow: 0 0 0 4px rgba(154,107,15,.14), 0 10px 22px rgba(154,107,15,.12); transform: translateX(6px); }
.c7-legend { font-size: .76rem; color: var(--muted); display: flex; flex-direction: column; gap: .25rem; margin-top: .6rem; }
.c7-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: .4rem; vertical-align: -1px; }
.c7-legend i.b { background: var(--accent-soft); border: 1.5px solid var(--accent); }
.c7-legend i.a { background: var(--amber-soft); border: 1.5px solid var(--amber); }

/* --- сцена-схема --- */
.c7-stage { position: absolute; left: 350px; top: 0; width: 790px; height: 440px; }
.c7-svg { position: absolute; inset: 0; width: 790px; height: 440px; }

/* граница системы: пунктир, пока систему собирают, сплошная — когда собрали */
.c7-bound { fill: var(--amber-soft); fill-opacity: .22; stroke: var(--amber); stroke-width: 1.5;
  stroke-dasharray: 7 7; opacity: 0; transition: opacity .6s ease; }
.built .c7-bound { opacity: .6; }
.full .c7-bound { opacity: 1; stroke-dasharray: none; stroke-width: 2; }
.c7-blbl { position: absolute; left: 146px; top: 12px; background: var(--stagebg); padding: 0 .5rem;
  font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--amber); font-weight: 600; opacity: 0; transform: translateY(-4px);
  transition: opacity .6s ease, transform .6s ease; }
.full .c7-blbl { opacity: 1; transform: none; }
.c7-blbl span { margin-left: .5rem; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: .04em; }

/* связи: всё, что соединяет узлы, — код людей, поэтому янтарные */
.c7-svg .ln { fill: none; stroke: var(--amber); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.c7-svg .ln.dash { stroke-dasharray: 6 6; }
.c7-svg #c7ar path { fill: var(--amber); }
.c7-e { opacity: 0; transition: opacity .55s ease .08s; }
.c7-e.on { opacity: 1; }
.c7-el { font-family: var(--mono); font-size: 10px; fill: var(--muted); letter-spacing: .04em; }

/* поток запроса на финале: одна линия под карточками, видна только в разрывах */
.c7-run { fill: none; stroke: var(--amber); stroke-width: 3; stroke-linecap: round;
  stroke-dasharray: 9 25; opacity: 0; transition: opacity .5s ease; }
.live .c7-run { opacity: .8; animation: c7flow 1.1s linear infinite; }
@keyframes c7flow { to { stroke-dashoffset: -34; } }

/* --- узлы обвязки --- */
.c7-node { position: absolute; box-sizing: border-box; width: 170px; height: 56px; padding: .38rem .6rem .4rem;
  background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 10px;
  box-shadow: 0 8px 18px rgba(23,32,43,.07); opacity: 0; transform: translateY(12px) scale(.96);
  transition: opacity .5s ease, transform .55s cubic-bezier(.2,.9,.3,1), box-shadow .4s ease; }
.c7-node.on { opacity: 1; transform: none; }
.c7-node.cur { box-shadow: 0 0 0 4px rgba(154,107,15,.14), 0 12px 24px rgba(154,107,15,.14); }
.c7-node .h { display: flex; align-items: baseline; justify-content: space-between;
  font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; }
.c7-node .h .nn { color: var(--amber); }
.c7-node .h .tt { color: var(--muted); }
.c7-node b { display: block; font-size: .92rem; font-weight: 600; line-height: 1.2; margin-top: .14rem; white-space: nowrap; }

/* --- ядро: голая модель --- */
.c7-core { position: absolute; left: 365px; top: 129px; width: 150px; height: 100px; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: #fff; border: 2px solid var(--accent); border-radius: 14px;
  box-shadow: 0 14px 30px rgba(47,95,168,.18);
  transition: transform .9s cubic-bezier(.3,.85,.25,1), box-shadow .6s ease; }
.c7-core b { font-size: 1.5rem; font-weight: 700; line-height: 1; }
.c7-core small { font-family: var(--mono); font-size: .74rem; color: var(--accent); margin-top: .34rem; }
.c7-core em { font-style: normal; font-family: var(--mono); font-size: .66rem; color: var(--muted); margin-top: .42rem; }
.solo .c7-core { transform: translate(-45px, 21px) scale(1.9); box-shadow: 0 26px 60px rgba(47,95,168,.22); }

/* --- внешний мир: всё, что за границей системы --- */
.c7-actor { position: absolute; box-sizing: border-box; text-align: center; font-size: .84rem;
  background: var(--inset); border: 1px solid var(--line); border-radius: 999px; padding: .2rem .4rem;
  opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease; }
.c7-actor.on { opacity: 1; transform: none; }
.c7-sub { position: absolute; text-align: center; font-family: var(--mono); font-size: .64rem;
  color: var(--muted); opacity: 0; transition: opacity .5s ease; }
.c7-sub.on { opacity: 1; }
.c7-world { position: absolute; left: 14px; top: 358px; font-family: var(--mono); font-size: .64rem;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity .5s ease; }
.c7-world.on { opacity: .9; }

/* --- шаг 1: что умеет и чего не умеет голая модель --- */
.c7-solo { position: absolute; inset: 0; pointer-events: none; }
.c7-solo .t { position: absolute; font-family: var(--mono); font-size: .84rem; color: var(--bad);
  background: var(--bad-soft); border: 1px solid var(--bad); border-radius: 999px; padding: .25rem .8rem;
  opacity: 0; transform: scale(.7); transition: all .5s ease; }
.solo .c7-solo .t { animation: popIn .45s ease both; }
.solo .c7-solo .t2 { animation-delay: .15s; } .solo .c7-solo .t3 { animation-delay: .3s; } .solo .c7-solo .t4 { animation-delay: .45s; }
.c7-solo .t1 { left: 60px; top: 60px; } .c7-solo .t2 { left: 470px; top: 48px; }
.c7-solo .t3 { left: 48px; top: 332px; } .c7-solo .t4 { left: 520px; top: 332px; }
.c7-solo .cap { position: absolute; left: 0; right: 0; top: 390px; text-align: center;
  font-size: 1.12rem; color: var(--muted); transition: opacity .4s ease; }
.c7-solo .cap b { color: var(--ink); font-weight: 600; }
.built .c7-solo .cap { opacity: 0; }

/* --- финал: рекламные обещания и их адреса в обвязке --- */
.c7-ads { position: absolute; left: 0; right: 0; top: 396px; display: flex; align-items: center; justify-content: center; gap: .5rem; }
.c7-ads .k { font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); opacity: 0; transition: opacity .4s ease .15s; }
.live .c7-ads .k { opacity: 1; }
.c7-ads .ad { white-space: nowrap; font-size: .82rem; font-style: italic; color: var(--ink);
  background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: .26rem .5rem .26rem .8rem;
  box-shadow: 0 8px 18px rgba(23,32,43,.07); opacity: 0; transform: translateY(12px); }
.c7-ads .ad b { font-style: normal; font-family: var(--mono); font-size: .74rem; font-weight: 500;
  margin-left: .5rem; padding: .06rem .45rem; border-radius: 999px; background: var(--amber-soft); color: var(--amber); }
.live .c7-ads .ad { animation: c7ad .5s cubic-bezier(.3,1.4,.5,1) both; }
.live .c7-ads .a1 { animation-delay: .35s; } .live .c7-ads .a2 { animation-delay: .6s; } .live .c7-ads .a3 { animation-delay: .85s; }
@keyframes c7ad { to { opacity: 1; transform: none; } }

/* ================= S8: агент (v4) ================= */
.a8-zone { position: absolute; left: 0; right: 0; top: 62px; height: 384px; }
.a8-left, .a8-log { transition: opacity .6s ease, transform .6s ease, filter .6s ease; }
.a8-left { position: absolute; left: 0; top: 0; width: 520px; height: 384px; }
.a8-chat { position: absolute; left: 0; top: 0; display: flex; flex-wrap: wrap; align-items: center; column-gap: .45rem; row-gap: 0; font-size: .98rem; white-space: nowrap;
  padding: .45rem .8rem; border-radius: 12px; background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 20px rgba(23,32,43,.05);
  transform-origin: left top; transition: all .7s cubic-bezier(.2,.9,.3,1); }
.a8-chat .chip { font-size: .92rem; }
.a8-chat i { font-style: normal; color: var(--muted); }
.a8-chat em { flex: 0 0 100%; font-style: normal; font-size: .82rem; color: var(--muted); margin-top: .15rem; }
.a8-k { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-right: .2rem; }
.a8-llm { font-weight: 700; border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: .05rem .55rem; }
.a8-zone:not(.loop) .a8-chat { transform: translate(10px, 140px) scale(1.08); }
.loop .a8-chat { opacity: .55; }

.a8-loop { position: absolute; left: 25px; top: 56px; width: 470px; height: 330px; opacity: 0; transform: scale(.88); transition: all .8s cubic-bezier(.2,.9,.3,1); }
.loop .a8-loop { opacity: 1; transform: none; }
.a8-svg { position: absolute; inset: 0; width: 470px; height: 330px; overflow: visible; }
.a8-orbit { fill: none; stroke: var(--line); stroke-width: 10; opacity: .45; }
/* виток показывает не бегунок, а дуга: кольцо заполняется от станции к станции */
.a8-arc { fill: none; stroke: var(--accent); stroke-width: 10; stroke-dasharray: 767; stroke-dashoffset: 767; }
.a8-run .a8-arc { animation: a8sweep 2.2s cubic-bezier(.45,.05,.35,1) both; }

  0%   { stroke-dashoffset: 767; }
  20%  { stroke-dashoffset: 511; }
  36%  { stroke-dashoffset: 511; }
  56%  { stroke-dashoffset: 256; }
  72%  { stroke-dashoffset: 256; }
  92%  { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
.a8-tick { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: .45; }
.done .a8-arc, .done .a8-tick { stroke: var(--good); }
.a8-core { position: absolute; left: 165px; top: 130px; width: 140px; height: 80px; border-radius: 18px; background: #fff; border: 2px solid var(--accent);
  box-shadow: 0 16px 36px rgba(47,95,168,.22); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3; }
.a8-core b { font-weight: 700; font-size: 1.75rem; line-height: 1; }
.a8-core small { font-family: var(--mono); font-size: .72rem; color: var(--accent); margin-top: .25rem; }
.done .a8-core { border-color: var(--good); box-shadow: 0 16px 36px rgba(46,125,79,.25); }
.done .a8-core small { color: var(--good); }

.a8-stg { position: absolute; inset: 0; }
.a8-st { position: absolute; width: 186px; padding: .35rem .5rem; border-radius: 12px; background: #fff; border: 1.5px solid var(--accent); text-align: center; z-index: 4;
  box-shadow: 0 8px 18px rgba(47,95,168,.12); --litsoft: var(--accent-soft); }
.a8-st b { display: block; font-size: .98rem; font-weight: 600; line-height: 1.3; }
.a8-st small { display: block; font-family: var(--mono); font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a8-st.t1 { left: 132px; top: 22px; }
.a8-st.t2 { left: 260px; top: 218px; border-color: var(--amber); box-shadow: 0 8px 18px rgba(154,107,15,.14); --litsoft: var(--amber-soft); }
.a8-st.t2 small { color: var(--amber); }
.a8-st.t3 { left: 4px; top: 218px; }
/* вместо летающего маркера — станции витка оживают по очереди */
.a8-stg.run .t1 { animation: a8lit .66s cubic-bezier(.2,.9,.3,1) 0s both; }
.a8-stg.run .t2 { animation: a8lit .66s cubic-bezier(.2,.9,.3,1) .44s both; }
.a8-stg.run .t3 { animation: a8lit .66s cubic-bezier(.2,.9,.3,1) 1.23s both; }
@keyframes a8lit {
  32% { transform: translateY(-4px) scale(1.03); background: var(--litsoft);
        box-shadow: 0 0 0 5px var(--litsoft), 0 14px 26px rgba(23,32,43,.16); }
}

.a8-log { position: absolute; right: 0; top: 0; width: 596px; height: 384px; border-radius: 14px; background: #fff; border: 1px solid var(--line);
  box-shadow: 0 18px 40px rgba(23,32,43,.08); overflow: hidden; }
.a8-log .kp-chat-head { font-size: .74rem; padding: .45rem .8rem; }
.a8-log .kp-chat-head i { width: 9px; height: 9px; }
.a8-task { padding: .55rem 1rem; font-size: .98rem; border-bottom: 1px dashed var(--line); }
.a8-task span { font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-right: .7rem; }
.a8-lines { padding: .45rem .7rem 0; }
.a8-turn { display: grid; grid-template-columns: 34px 1fr; align-items: center; padding: .28rem .4rem; border-radius: 9px; margin-bottom: .18rem;
  opacity: .16; transform: translateX(10px); transition: all .5s ease; }
.a8-turn.on { opacity: 1; transform: none; }
.a8-turn.cur { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.a8-turn > b { font-family: var(--mono); font-weight: 500; font-size: .8rem; color: var(--accent); }
.a8-turn .c { font-family: var(--mono); font-size: .82rem; color: var(--amber); line-height: 1.35; }
.a8-turn .r { font-family: var(--mono); font-size: .8rem; color: var(--ink); line-height: 1.35; }
.a8-turn.cur .r { animation: fadeUp .5s ease .9s both; }
.a8-foot { position: absolute; left: 1rem; right: 1rem; bottom: .7rem; display: flex; align-items: center; gap: .8rem; font-family: var(--mono); font-size: .74rem; color: var(--muted); }
.a8-gauge { width: 160px; height: 8px; border-radius: 99px; background: var(--inset); overflow: hidden; }
.a8-gauge i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .8s ease; }
.a8-fin { margin-left: auto; color: var(--good); font-weight: 500; opacity: 0; transition: opacity .5s ease 1.4s; }
.done .a8-fin { opacity: 1; }

.multi .a8-left, .multi .a8-log { opacity: 0; transform: scale(.95); filter: blur(3px); pointer-events: none; }
.a8-multi { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
.multi .a8-multi { opacity: 1; }
.a8-mh { text-align: center; font-family: var(--disp); font-size: 1.55rem; line-height: 1.25; margin-top: .1rem; }
.a8-mh b { font-weight: 650; color: var(--accent); }
.a8-pats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 16px; }
.a8-pat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px 14px; box-shadow: 0 14px 30px rgba(23,32,43,.07); opacity: 0; }
.multi .a8-pat { animation: a8card .7s cubic-bezier(.2,.9,.3,1) var(--d) both; }
@keyframes a8card { from { opacity: 0; transform: translateY(26px) scale(.94); } to { opacity: 1; transform: none; } }
.a8-pat .pt { font-size: 1.18rem; font-weight: 700; line-height: 1.2; padding-left: 4px; }
.a8-pat svg { display: block; width: 100%; height: auto; margin: 14px 0 12px; overflow: visible; }
.a8-pat .pc { font-size: .86rem; color: var(--muted); line-height: 1.35; padding: 0 4px; min-height: 2.4em; }
.a8-edge { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 5 5; opacity: .75; }
.a8-edge.hot { stroke-dasharray: none; opacity: 1; stroke-width: 2.5; }
.a8-edge.bad { stroke: var(--bad); }
.a8-edge.dim { opacity: .3; }
/* направление потока — стрелка на конце связи, а не летающая точка */
.a8-ah { fill: none; stroke: var(--amber); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.a8-ah.bad { stroke: var(--bad); }
.a8-ah.dim { opacity: .3; }
.a8-pn rect.m { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.a8-pn rect.c { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.5; }
.a8-pn rect.hub { fill: var(--accent); stroke: var(--accent); }
.a8-pn text { font-family: "Golos Text", sans-serif; font-size: 12.5px; fill: var(--ink); }
.a8-pn rect.hub + text { fill: #fff; font-weight: 600; }
.a8-pn.dim { opacity: .38; }
.a8-note { font-family: var(--mono); font-size: 11.5px; fill: var(--accent); }
.a8-note.r { fill: var(--bad); }
.a8-leg { display: flex; justify-content: center; gap: 1.6rem; margin-top: 12px; font-size: .86rem; color: var(--muted); }
.a8-leg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: .4rem; vertical-align: -1px; }
.a8-leg i.b { background: var(--accent-soft); border: 1.5px solid var(--accent); }
.a8-leg i.a { background: var(--amber-soft); border: 1.5px solid var(--amber); }

.a8-frame { position: absolute; left: -16px; right: -16px; top: -8px; bottom: 24px; border: 2.5px solid var(--amber); border-radius: 18px; pointer-events: none;
  opacity: 0; transform: scale(1.04); transition: all .7s cubic-bezier(.2,.9,.3,1); z-index: 6; }
.guard .a8-frame { opacity: 1; transform: none; box-shadow: 0 0 0 7px rgba(154,107,15,.08); }
.a8-frame .flbl { position: absolute; top: -13px; left: 26px; background: var(--stagebg); padding: 0 .55rem; font-size: .92rem; color: var(--amber); font-weight: 600; }
.a8-lims { position: absolute; left: 0; right: 0; bottom: -17px; display: flex; justify-content: center; gap: .8rem; }
.a8-lims span { background: var(--amber-soft); border: 1.5px solid var(--amber); color: var(--ink); border-radius: 999px; padding: .2rem .85rem; font-size: .88rem; white-space: nowrap; opacity: 0; }
.a8-lims b { font-family: var(--mono); font-weight: 500; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); margin-right: .5rem; }
.guard .a8-lims span { animation: popIn .5s ease var(--d) both; }

.a8-formula { position: absolute; left: 0; right: 0; top: 462px; display: flex; justify-content: center; align-items: center; gap: .5rem; font-size: 1.05rem; }
.a8-formula i { font-style: normal; color: var(--muted); font-size: 1.2rem; }
.a8-formula .tl { padding: .3rem .8rem; border-radius: 10px; white-space: nowrap; }
.a8-formula .tl.b { background: var(--accent-soft); border: 1.5px solid var(--accent); }
.a8-formula .tl.a { background: var(--amber-soft); border: 1.5px solid var(--amber); }
.a8-formula .tl.res { color: #fff; font-weight: 700; font-size: 1.15rem; padding: .2rem 1rem; background: var(--accent); box-shadow: 0 10px 24px rgba(47,95,168,.35); }
.a8-formula em { font-style: normal; color: var(--muted); font-size: .92rem; margin-left: .7rem; }
.st.on.a8-formula .tl, .st.on.a8-formula i { animation: popIn .45s ease both; }
.st.on.a8-formula > :nth-child(3) { animation-delay: .12s; } .st.on.a8-formula > :nth-child(5) { animation-delay: .24s; }
.st.on.a8-formula > :nth-child(7) { animation-delay: .36s; } .st.on.a8-formula > :nth-child(9) { animation-delay: .6s; }

@media (prefers-reduced-motion: reduce) {
  .a8-run .a8-arc { animation: none; stroke-dashoffset: 0; }
  .a8-stg.run .a8-st { animation: none; }
}

/* ================= S9: итог ================= */
.f9 { position: absolute; inset: 0; }
.f9-col { position: absolute; top: 0; width: 318px; display: flex; flex-direction: column; gap: 11px; transition: opacity .8s ease, filter .8s ease; }
.f9-col.l { left: 0; } .f9-col.r { right: 0; }
.f9-card { position: relative; height: 99px; box-sizing: border-box; display: grid; grid-template-columns: 40px 1fr; gap: .35rem; align-items: start;
  padding: 12px 14px 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 24px rgba(23,32,43,.06); opacity: 0; }
.f9-card::before { content: ''; position: absolute; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--accent); }
.l .f9-card::before { left: -1px; } .r .f9-card::before { right: -1px; background: var(--amber); }
.f9-card .n { font-family: var(--mono); font-size: .8rem; color: var(--accent); width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center; background: var(--accent-soft); }
.r .f9-card .n { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.f9-card b { display: block; font-size: 1.04rem; font-weight: 600; line-height: 1.2; margin-bottom: .2rem; }
.f9-card small { display: block; font-size: .84rem; color: var(--muted); line-height: 1.34; }
.f9-card small em { font-style: normal; color: var(--ink); font-weight: 500; }
.s0 .l .f9-card { animation: f9inL .7s cubic-bezier(.2,.9,.3,1) var(--d) both; }
.s1 .r .f9-card { animation: f9inR .7s cubic-bezier(.2,.9,.3,1) var(--d) both; }
@keyframes f9inL { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
@keyframes f9inR { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }

.f9-map { position: absolute; left: 330px; top: 0; width: 480px; height: 430px; transition: transform 1.1s cubic-bezier(.2,.9,.3,1), opacity 1.1s ease, filter 1.1s ease; }
.f9-map svg { width: 100%; height: 100%; overflow: visible; fill: var(--ink); }
.f9-map text { font-family: "Golos Text", "Segoe UI", Arial, sans-serif; }
.f9-part, .f9-b { opacity: 0; transition: opacity .8s ease, transform .8s cubic-bezier(.2,.9,.3,1); transform-box: view-box; transform-origin: 240px 215px; transform: scale(.965); }
.s0 .p01, .s0 .p02, .s0 .p03, .s0 .p04, .s1 .p05, .s1 .p06, .s1 .p07, .s1 .p08 { opacity: 1; transform: none; }
.s0 .p01 { transition-delay: .35s; } .s0 .p02 { transition-delay: .65s; } .s0 .p03 { transition-delay: .9s; } .s0 .p04 { transition-delay: 1.2s; }
.s1 .p05 { transition-delay: .35s; } .s1 .p06 { transition-delay: .65s; } .s1 .p07 { transition-delay: .9s; } .s1 .p08 { transition-delay: 1.2s; }
.s0 .f9-b.p01, .s0 .f9-b.p02, .s0 .f9-b.p03, .s0 .f9-b.p04, .s1 .f9-b.p05, .s1 .f9-b.p06, .s1 .f9-b.p07, .s1 .f9-b.p08 { opacity: 1; transform: none; }
.s0 .f9-b.p01 { transition-delay: .45s; } .s0 .f9-b.p02 { transition-delay: .75s; } .s0 .f9-b.p03 { transition-delay: 1s; } .s0 .f9-b.p04 { transition-delay: 1.3s; }
.s1 .f9-b.p05 { transition-delay: .45s; } .s1 .f9-b.p06 { transition-delay: .75s; } .s1 .f9-b.p07 { transition-delay: 1s; } .s1 .f9-b.p08 { transition-delay: 1.3s; }
.f9-b circle { fill: #fff; stroke: var(--accent); stroke-width: 1.6; }
.f9-b text { font-family: var(--mono); font-size: 10px; font-weight: 500; fill: var(--accent); }
.f9-b.am circle { stroke: var(--amber); }
.f9-b.am text { fill: var(--amber); }

/* блоки схемы: синее — модель, янтарное — код людей, белое — человек, красное — недоверенные данные */
.f9-frame { fill: var(--amber-soft); fill-opacity: .14; stroke: var(--amber); stroke-width: 2; }
.f9-bx { fill: #fff; stroke: var(--line); stroke-width: 1.4; }
.f9-bx.code { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.8; }
.f9-bx.mdl { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.2; filter: drop-shadow(0 10px 18px rgba(47,95,168,.18)); }
.f9-bx.alt { fill: #fff; stroke: var(--accent); stroke-width: 1.5; }
.f9-bx.evil { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.5; }
.f9-seg { fill: #fff; stroke: var(--amber); stroke-width: 1; }
.f9-seg.hot { fill: none; stroke: var(--bad); stroke-width: 1.8; }

.f9-t0 { font-size: 11px; font-weight: 500; fill: var(--ink); }
.f9-t1 { font-size: 13.5px; font-weight: 600; fill: var(--ink); }
.f9-t1.big { font-size: 17px; font-weight: 650; }
.f9-t2 { font-size: 10px; fill: var(--muted); }
.f9-t3 { font-size: 9.5px; fill: var(--muted); }
.f9-t3.bl { fill: var(--accent); } .f9-t3.bad { fill: var(--bad); }
.f9-sgt { font-size: 9.5px; fill: var(--ink); }
.f9-mn { font-family: var(--mono); font-size: 10px; fill: var(--accent); }
.f9-lbl { font-size: 9.5px; paint-order: stroke; stroke: var(--stagebg); stroke-width: 5px; stroke-linejoin: round; }
.f9-lbl.am { fill: var(--amber); } .f9-lbl.mu { fill: var(--muted); }
.f9-flbl { font-size: 12.5px; font-weight: 600; fill: var(--amber); paint-order: stroke; stroke: var(--stagebg); stroke-width: 5px; stroke-linejoin: round; }

.f9-fl { fill: none; stroke: var(--amber); stroke-width: 1.8; stroke-linejoin: round; }
.f9-fl.hum { stroke: var(--muted); stroke-width: 1.6; }
.f9-fl.bad { stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 5 4; }
.f9-fl.loop { stroke-dasharray: 7 6; animation: f9flow 1.6s linear infinite; }
@keyframes f9flow { to { stroke-dashoffset: -26; } }
.f9-tie { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 3 3; }
.f9-mk { fill: var(--amber); } .f9-mk.hum { fill: var(--muted); } .f9-mk.bad { fill: var(--bad); }
.f9-sw { stroke-width: 1.4; }
.f9-sw.b { fill: var(--accent-soft); stroke: var(--accent); }
.f9-sw.a { fill: var(--amber-soft); stroke: var(--amber); }

.f9-gloss { position: absolute; left: 0; right: 0; top: 440px; display: grid; grid-template-columns: 70px repeat(4, 1fr); gap: 10px; align-items: stretch; transition: opacity .8s ease, filter .8s ease; }
.f9-gloss .gk { align-self: center; font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); opacity: 0; }
.f9-gloss .g { background: var(--inset); border-radius: 12px; padding: .42rem .7rem; font-size: .8rem; line-height: 1.3; color: var(--muted); opacity: 0; }
.f9-gloss .g b { display: block; font-family: var(--mono); font-size: .7rem; font-weight: 500; color: var(--ink); letter-spacing: .04em; margin-bottom: .1rem; }
.f9-gloss .g i { font-style: normal; color: var(--ink); padding: 0 .1em; border-radius: 3px; }
.f9-gloss .tk0 { background: #E8E0F7; } .f9-gloss .tk1 { background: #D7EEED; } .f9-gloss .tk2 { background: #F9E0EA; }
.s2 .f9-gloss .gk { animation: fadeUp .5s ease both; }
.s2 .f9-gloss .g { animation: fadeUp .55s ease var(--d) both; }

.s3 .f9-col, .s3 .f9-gloss { opacity: .1; filter: blur(2.5px); }
.s3 .f9-map { transform: scale(1.1) translateY(14px); opacity: .12; filter: blur(2px); }
.f9-fin { position: absolute; left: -70px; right: -70px; top: -20px; bottom: -60px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  pointer-events: none; opacity: 0; transition: opacity .6s ease;
  background: radial-gradient(ellipse 55% 48% at 50% 50%, rgba(248,250,252,.96) 30%, rgba(248,250,252,0)); }
.s3 .f9-fin { opacity: 1; }
.f9-ad { position: relative; display: inline-block; opacity: 0; }
.f9-ad span { display: inline-block; font-size: 1.1rem; color: #fff; padding: .35rem 1.1rem; border-radius: 999px; background: linear-gradient(90deg, #7B2FF7, #3D63FF);
  box-shadow: 0 10px 26px rgba(110,60,240,.3); }
.f9-ad::after { content: ''; position: absolute; left: -8px; right: -8px; top: 50%; height: 3px; margin-top: -1.5px; background: var(--bad); border-radius: 2px; transform: scaleX(0); transform-origin: left; }
.s3 .f9-ad { animation: fadeUp .5s ease .3s both, f9dim .6s ease 1.5s forwards; }
.s3 .f9-ad::after { animation: f9strike .45s cubic-bezier(.6,0,.3,1) 1s forwards; }
@keyframes f9strike { to { transform: scaleX(1); } }
@keyframes f9dim { to { opacity: .45; filter: grayscale(.9); transform: scale(.94); } }
.f9-th { position: relative; z-index: 0; margin-top: 1.6rem; font-family: var(--disp); color: var(--ink); line-height: 1.12; }
.f9-th .l1 { font-size: 3.6rem; font-weight: 650; opacity: 0; }
.f9-th .l2 { font-size: 2.35rem; font-weight: 600; margin-top: .55rem; opacity: 0; }
.s3 .f9-th .l1 { animation: f9rise .8s cubic-bezier(.2,.9,.3,1) 1.6s both; }
.s3 .f9-th .l2 { animation: f9rise .8s cubic-bezier(.2,.9,.3,1) 2.2s both; }
@keyframes f9rise { from { opacity: 0; transform: translateY(22px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.f9-th .hb { background: linear-gradient(100deg, #1F467F 0%, #2F5FA8 35%, #9CC2F5 50%, #2F5FA8 65%, #1F467F 100%); background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: f9shine 3.2s ease-in-out 2.4s infinite; }
@keyframes f9shine { 0% { background-position: 100% 0; } 60%, 100% { background-position: -50% 0; } }
.f9-th .ha { position: relative; white-space: nowrap; }
.f9-th .ha::before { content: ''; position: absolute; left: -.1em; right: -.1em; bottom: .06em; height: .38em; background: var(--amber-soft); border-radius: 4px; z-index: -1; transform: scaleX(0); transform-origin: left; }
.s3 .f9-th .ha::before { animation: f9strike .6s ease 2.9s forwards; }
.f9-sub { margin-top: 1.6rem; font-size: 1.12rem; color: var(--muted); opacity: 0; }
.f9-sub b { color: var(--ink); font-weight: 600; }
.s3 .f9-sub { animation: fadeUp .6s ease 3.3s both; }

<script>
/* «Модель и обвязка» — React + htm, всё заинлайнено. */
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);
const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const st = (s, n, extra) => 'st ' + (s >= n ? 'on ' : '') + (extra || '');

function Head({ num, title, en }) {
  return html`<div className="shead">
    <span className="snum">${num}</span>
    <span className="stitle">${title}</span>
    ${en ? html`<span className="sen">${en}</span>` : null}
  </div>`;
}

/* Появление текста «как генерация» */
function Gen({ text, active }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (active === false) { setN(0); return; }
    if (rm) { setN(text.length); return; }
    setN(0);
    const id = setInterval(() => setN(v => (v >= text.length ? (clearInterval(id), v) : v + 2)), 22);
    return () => clearInterval(id);
  }, [active, text]);
  const done = n >= text.length;
  return html`<span>${text.slice(0, n)}${!done && active !== false ? html`<span className="caret"></span>` : null}</span>`;
}

/* Печатание с подсветкой сегментов: segs = [[текст, класс?], …] */
function GenR({ segs, active }) {
  const total = segs.reduce((a, x) => a + x[0].length, 0);
  const [n, setN] = useState(0);
  useEffect(() => {
    if (active === false) { setN(0); return; }
    if (rm) { setN(total); return; }
    setN(0);
    const id = setInterval(() => setN(v => (v >= total ? (clearInterval(id), v) : v + 2)), 22);
    return () => clearInterval(id);
  }, [active]);
  let left = n;
  const out = segs.map(([t, cls], i) => {
    const take = Math.max(0, Math.min(t.length, left));
    left -= take;
    return html`<span key=${i} className=${cls || ''}>${t.slice(0, take)}</span>`;
  });
  const done = n >= total;
  return html`<span>${out}${!done && active !== false ? html`<span className="caret"></span>` : null}</span>`;
}

/* Gen с задержкой старта печати */
function DelayGen({ delay, text, active }) {
  const [go, setGo] = useState(false);
  useEffect(() => {
    if (!active) { setGo(false); return; }
    if (rm) { setGo(true); return; }
    const id = setTimeout(() => setGo(true), delay);
    return () => clearTimeout(id);
  }, [active]);
  return html`<${Gen} active=${go} text=${text} />`;
}

/* Фоновая анимация: дрейф слов-токенов и мягкие пятна */
function Bg() {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    let W = (cv.width = window.innerWidth), H = (cv.height = window.innerHeight);
    const WORDS = ['токен', 'модель', 'промпт', 'контекст', '0.42', '−0.17', '0.93', 'текст →', 'вес'];
    const ps = Array.from({ length: 22 }, () => ({
      x: Math.random(), y: Math.random(), v: .25 + Math.random() * .6,
      w: WORDS[(Math.random() * WORDS.length) | 0],
      f: 11 + Math.random() * 9, o: .05 + Math.random() * .07,
    }));
    let raf;
    const draw = (t) => {
      ctx.clearRect(0, 0, W, H);
      const bx = W * .5 + Math.cos(t / 9000) * W * .3, by = H * .3 + Math.sin(t / 11000) * H * .25;
      let g = ctx.createRadialGradient(bx, by, 0, bx, by, 520);
      g.addColorStop(0, 'rgba(47,95,168,.055)'); g.addColorStop(1, 'rgba(47,95,168,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const cx = W * .22 + Math.sin(t / 12000) * W * .18, cy = H * .8 + Math.cos(t / 8000) * H * .15;
      g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 430);
      g.addColorStop(0, 'rgba(154,107,15,.045)'); g.addColorStop(1, 'rgba(154,107,15,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#2F5FA8';
      for (const p of ps) {
        p.y -= p.v / 1400;
        if (p.y < -.04) { p.y = 1.04; p.x = Math.random(); }
        ctx.globalAlpha = p.o;
        ctx.font = p.f + 'px "JetBrains Mono", monospace';
        ctx.fillText(p.w, p.x * W, p.y * H);
      }
      ctx.globalAlpha = 1;
      if (!rm) raf = requestAnimationFrame(draw);
    };
    const size = () => {
      W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
      if (rm) draw(0);
    };
    window.addEventListener('resize', size);
    draw(0);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', size); };
  }, []);
  return html`<canvas ref=${ref} className="bgfx"></canvas>`;
}

/* Печатание токенов */
function Type({ pre, parts, active, token }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!active) { setN(0); return; }
    if (rm) { setN(parts.length); return; }
    setN(0);
    const id = setInterval(() => setN(v => (v >= parts.length ? (clearInterval(id), v) : v + 1)), 150);
    return () => clearInterval(id);
  }, [active]);
  return html`<span>
    ${pre ? html`<span className="src">${pre}</span>` : null}
    ${parts.slice(0, n).map((p, i) => html`<span key=${i} className=${token ? 'tok tok' + (i % 4) : ''}>${p}</span>`)}
    ${active && n < parts.length ? html`<span className="caret"></span>` : null}
  </span>`;
}

/* Канвас с «весами» */
function Weights({ active }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = (cv.width = cv.clientWidth * 2), H = (cv.height = cv.clientHeight * 2);
    const cw = 34, ch = 26;
    const cols = Math.ceil(W / cw), rows = Math.ceil(H / ch);
    const cells = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      cells.push({ c, r, v: (Math.random() * 2 - 1).toFixed(2) });
    let raf;
    const draw = (t) => {
      ctx.clearRect(0, 0, W, H);
      ctx.font = '13px "JetBrains Mono", monospace';
      const wave = (t / 130) | 0;
      for (const cell of cells) {
        const hot = ((cell.c + cell.r + wave) % 19) === 0;
        ctx.fillStyle = hot ? '#82ABE2' : 'rgba(150,162,180,.42)';
        ctx.fillText(cell.v, cell.c * cw + 4, cell.r * ch + 17);
      }
      if (active && !rm) raf = requestAnimationFrame(draw);
    };
    draw(0);
    if (active && !rm) raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [active]);
  return html`<canvas ref=${ref} className="m-weights"></canvas>`;
}

/* WebGL-глянец на титуле */
function Gloss() {
  const ref = useRef(null);
  const [fail, setFail] = useState(false);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    let gl;
    try { gl = cv.getContext('webgl', { antialias: false }); if (!gl) throw new Error('no gl'); }
    catch (e) { setFail(true); return; }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
    const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    const fs = `precision mediump float;uniform float uT;uniform vec2 uR;
      float hash(vec2 g){return fract(sin(dot(g,vec2(12.9898,78.233)))*43758.5453);}
      void main(){
        vec2 uv=gl_FragCoord.xy/uR;
        vec3 c1=vec3(.47,.19,.96),c2=vec3(.24,.38,1.),c3=vec3(.72,.18,.84);
        vec3 col=mix(c1,c2,clamp(uv.x+.25*sin(uT*.6+uv.y*3.),0.,1.));
        col=mix(col,c3,.5+.5*sin(uT*.4+uv.x*4.+uv.y*2.));
        float streak=pow(max(0.,sin(uv.x*3.-uT*.8+uv.y*1.5)),24.)*.65;
        vec2 cell=uv*vec2(42.,13.);
        vec2 g=floor(cell);
        vec2 f=fract(cell)-.5;
        float h=hash(g);
        float tw=smoothstep(.986,1.,h*.5+.5*sin(uT*(1.5+h*3.)+h*40.));
        col+=streak+tw*smoothstep(.4,.0,length(f))*.9;
        gl_FragColor=vec4(col,1.);
      }`;
    const mk = (type, src) => { const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); return sh; };
    const pr = gl.createProgram();
    gl.attachShader(pr, mk(gl.VERTEX_SHADER, vs));
    gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { setFail(true); return; }
    gl.useProgram(pr);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const uT = gl.getUniformLocation(pr, 'uT'), uR = gl.getUniformLocation(pr, 'uR');
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform2f(uR, cv.width, cv.height);
    let raf; const t0 = performance.now();
    const frame = () => {
      gl.uniform1f(uT, (performance.now() - t0) / 1000);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!rm) raf = requestAnimationFrame(frame);
    };
    gl.uniform1f(uT, 1.7); gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!rm) raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, []);
  if (fail) return html`<div className="t-gl t-fallback"></div>`;
  return html`<canvas ref=${ref} className="t-gl"></canvas>`;
}

/* Вердикт прогонов: числа «прокручиваются» и фиксируются */
function RollNum({ to, show, delay }) {
  const [n, setN] = useState(0);
  const [roll, setRoll] = useState(false);
  useEffect(() => {
    if (!show) { setN(0); setRoll(false); return; }
    if (rm) { setN(to); return; }
    const t = setTimeout(() => {
      setRoll(true);
      let k = 0;
      const id = setInterval(() => {
        k++;
        if (k < 7) setN(2 + ((Math.random() * 3) | 0));
        else { clearInterval(id); setN(to); setRoll(false); }
      }, 65);
    }, delay);
    return () => clearTimeout(t);
  }, [show]);
  return html`<span className=${'num' + (roll ? ' roll' : '')}>${n}</span>`;
}

function Verdict({ kind, runs, outs, word, note, show, delay }) {
  return html`<div className=${'vd ' + kind + (show ? ' show' : '')} style=${{ animationDelay: (delay / 1000) + 's' }}>
    <span className="ico">${kind === 'code' ? '=' : '≈'}</span>
    <span className="body">
      <span className="line">
        <${RollNum} to=${runs} show=${show} delay=${delay + 120} /> прогона
        <span className="arr">→</span>
        <${RollNum} to=${outs} show=${show} delay=${delay + 420} /> ${word}
      </span>
      <span className="note" dangerouslySetInnerHTML=${{ __html: note }}></span>
    </span>
  </div>`;
}

/* Кандидаты: на каждом шаге генерации — свои варианты с вероятностями */
const CANDS = [
  { h: 'шаг 1', items: [['Комиссию', 44], ['Возврат', 32], ['Увы,', 21], ['По приказу', 3]] },
  { h: 'шаг 2', items: [['вернём', 47], ['оформим', 31], ['возврат невозможен', 19], ['ЦБ № 55', 3]] },
  { h: 'шаг 3', items: [['за 3 дня', 51], ['в течение трёх дней', 30], ['по договору', 17], ['комиссия отменена', 2]] },
];
const RUN_PICK = [[0, 0, 0], [0, 0, 0], [1, 1, 1], [2, 2, 2], [3, 3, 3]];
const RUN_TEXT = [
  'Комиссию вернём за 3 дня',
  'Возврат оформим в течение трёх дней',
  'Увы, возврат невозможен по договору',
  'По приказу ЦБ № 55 комиссия отменена',
];

function CandGrid({ run }) {
  const [pick, setPick] = useState([0, 0, 0]);
  const [locked, setLocked] = useState([false, false, false]);
  const live = useRef([false, false, false]);
  useEffect(() => {
    if (run === 0 || rm) { setPick(RUN_PICK[run]); setLocked([true, true, true]); return; }
    live.current = [true, true, true];
    setLocked([false, false, false]);
    const tick = setInterval(() => setPick(p => p.map((v, i) => live.current[i] ? (v + 1 + ((Math.random() * 3) | 0)) % 4 : v)), 90);
    const stops = [420, 700, 980].map((t, i) => setTimeout(() => {
      live.current[i] = false;
      setPick(p => p.map((v, j) => j === i ? RUN_PICK[run][i] : v));
      setLocked(l => l.map((x, j) => j === i ? true : x));
    }, t));
    return () => { clearInterval(tick); stops.forEach(clearTimeout); };
  }, [run]);
  const busy = locked.some(x => !x);
  const bad = run >= 4;
  return html`<div className=${'cd' + (busy ? ' busy' : '')}>
    ${CANDS.map((col, i) => html`<div key=${i} className=${'cd-col' + (i === 1 ? ' mid' : i === 2 ? ' wide' : '')}>
      <div className="cd-h">${col.h}</div>
      ${col.items.map(([w, p], k) => html`<div key=${k}
        className=${'cd-card' + (pick[i] === k ? ' hot' : '') + (pick[i] === k && locked[i] ? ' lock' : '') + (bad ? ' bad' : '')}>
        <span>${w}</span><em>${p}%</em>
      </div>`)}
    </div>`)}
  </div>`;
}

/* Прогоны LLM: три разных ответа на один вход, четвёртый — галлюцинация из маловероятных слов */
function LLMRuns({ s }) {
  const [run, setRun] = useState(0);
  const [typed, setTyped] = useState(0);
  useEffect(() => {
    if (s < 2) { setRun(0); setTyped(0); return; }
    if (rm) { const n = s >= 3 ? 4 : 3; setRun(n); setTyped(n); return; }
    const ids = [];
    if (s === 2) {
      setRun(0); setTyped(0);
      [450, 2650, 4850].forEach((t, i) => ids.push(setTimeout(() => setRun(i + 1), t)));
      [1650, 3850, 6050].forEach((t, i) => ids.push(setTimeout(() => setTyped(i + 1), t)));
    } else {
      setRun(3); setTyped(3);
      ids.push(setTimeout(() => setRun(4), 450));
      ids.push(setTimeout(() => setTyped(4), 1650));
    }
    return () => ids.forEach(clearTimeout);
  }, [s]);
  return html`<div>
    <${CandGrid} run=${run} />
    <div className="dt-cap">на каждом шаге — выбор по вероятностям, с элементом случайности</div>
    <div className="dt-outs">
      ${RUN_TEXT.map((t, i) => typed >= i + 1
        ? html`<span key=${i} className=${'dt-out pop' + (i === 3 ? ' h4x on' : '')}>Б${'₁₂₃₄'[i]} «${t}»${i === 3 ? html`<span className="halu">галлюцинация — правдоподобно и ложно</span>` : null}</span>`
        : null)}
    </div>
    <div className="dt-vd">
      ${s >= 3 ? html`<${Verdict} kind="model" runs=${4} outs=${4} word="разных ответа" note="разброс — <b>штатное свойство</b>, его закладывают в проект" show=${true} delay=${1900} />` : null}
    </div>
  </div>`;
}

function Counter({ to, active }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!active) { setN(0); return; }
    if (rm) { setN(to); return; }
    const t0 = performance.now();
    let raf;
    const f = t => { const k = Math.min(1, (t - t0) / 1450); setN(Math.round(to * k)); if (k < 1) raf = requestAnimationFrame(f); };
    raf = requestAnimationFrame(f);
    return () => cancelAnimationFrame(raf);
  }, [active]);
  return html`<span>${n}</span>`;
}

/* ============ каркас ============ */

const SLIDES = [
  { title: 'Титул', steps: 3, comp: SlideTitle},
  { title: 'Модель', steps: 5, comp: SlideModel},
  { title: 'Детерминированность', steps: 4, comp: SlideDet},
  { title: 'Виды моделей', steps: 4, comp: SlideKinds},
  { title: 'Промпт', steps: 7, comp: SlidePrompt},
  { title: 'Инструмент', steps: 9, comp: SlideTool},
  { title: 'Промпт-инъекция', steps: 6, comp: SlideInj},
  { title: 'Модель и система', steps: 7, comp: SlideSystem},
  { title: 'Агент', steps: 9, comp: SlideAgent},
  { title: 'Итог', steps: 4, comp: SlideFinal},
];
const TOTAL = SLIDES.reduce((a, x) => a + x.steps, 0);
const before = SLIDES.map((x, i) => SLIDES.slice(0, i).reduce((a, y) => a + y.steps, 0));

function loadPos() {
  try {
    const p = JSON.parse(localStorage.getItem('mio-deck-pos'));
    if (p && SLIDES[p.i] && p.s < SLIDES[p.i].steps) return p;
  } catch (e) { /* пусто */ }
  return { i: 0, s: 0 };
}

function App() {
  const [pos, setPos] = useState(loadPos);
  const [k, setK] = useState(1);

  useEffect(() => {
    const fit = () => setK(Math.min(window.innerWidth / 1280, window.innerHeight / 720));
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  useEffect(() => {
    try { localStorage.setItem('mio-deck-pos', JSON.stringify(pos)); } catch (e) { /* пусто */ }
  }, [pos]);

  const next = () => setPos(p => {
    if (p.s < SLIDES[p.i].steps - 1) return { i: p.i, s: p.s + 1 };
    if (p.i < SLIDES.length - 1) return { i: p.i + 1, s: 0 };
    return p;
  });
  const prev = () => setPos(p => {
    if (p.s > 0) return { i: p.i, s: p.s - 1 };
    if (p.i > 0) return { i: p.i - 1, s: SLIDES[p.i - 1].steps - 1 };
    return p;
  });
  const jump = d => setPos(p => {
    const i = Math.max(0, Math.min(SLIDES.length - 1, p.i + d));
    return { i, s: 0 };
  });

  useEffect(() => {
    const onKey = e => {
      if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); jump(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); jump(-1); }
      else if (e.key === 'Home') setPos({ i: 0, s: 0 });
      else if (e.key === 'End') setPos({ i: SLIDES.length - 1, s: 0 });
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const slide = SLIDES[pos.i];
  const progress = ((before[pos.i] + pos.s + 1) / TOTAL * 100).toFixed(1);

  return html`<div>
    <div className="progress" style=${{ width: progress + '%' }}></div>
    <${Bg} />
    <div className="viewport" onClick=${e => { if (e.target.closest('.stage')) next(); }}>
      <div className="stage" style=${{ transform: 'scale(' + k + ')' }}>
        <${slide.comp} key=${pos.i} s=${pos.s} />
      </div>
    </div>
    <div className="footer">${pos.i + 1}/${SLIDES.length} · ${slide.title} · ${pos.s + 1}/${slide.steps}</div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>
